[unix_http_server]
file=%(ENV_APP_ROOT)s/.runtime/supervisor.sock
chmod=0600

[supervisord]
logfile=%(ENV_APP_ROOT)s/.runtime/supervisord.log
pidfile=%(ENV_APP_ROOT)s/.runtime/supervisord.pid
childlogdir=%(ENV_APP_ROOT)s/.runtime
logfile_maxbytes=5MB
logfile_backups=3

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_APP_ROOT)s/.runtime/supervisor.sock

[program:backend]
directory=%(ENV_APP_ROOT)s/backend
command=%(ENV_APP_ROOT)s/backend/.venv/bin/gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 1 --threads 4 --access-logfile - --error-logfile -
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_APP_ROOT)s/.runtime/backend.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
priority=10

[program:frontend]
directory=%(ENV_APP_ROOT)s/frontend
command=%(ENV_NODE_BIN)s .output/server/index.mjs
environment=NODE_ENV="production",HOST="127.0.0.1",PORT="3000",NITRO_HOST="127.0.0.1",NITRO_PORT="3000"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_APP_ROOT)s/.runtime/frontend.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
priority=20

[program:proxy]
directory=%(ENV_APP_ROOT)s
command=%(ENV_CADDY_BIN)s run --config %(ENV_APP_ROOT)s/deploy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_APP_ROOT)s/.runtime/proxy.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
priority=30

[program:telegram]
directory=%(ENV_APP_ROOT)s/backend
command=%(ENV_APP_ROOT)s/backend/.venv/bin/python manage.py telegram_bot
autostart=true
autorestart=unexpected
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_APP_ROOT)s/.runtime/telegram.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
priority=40
